[project]
name = "kestrel-feature-github"
version = "0.2.0"
description = "Kestrel GitHub integration feature"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "kestrel-sovereign-sdk>=0.11,<1",
    "aiosqlite>=0.21.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.entry-points."kestrel_sovereign.features"]
GitHubFeature = "kestrel_feature_github:GitHubFeature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kestrel_feature_github"]
